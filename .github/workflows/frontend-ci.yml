name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'packages/shared/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/frontend/**'
      - 'packages/shared/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/frontend/package-lock.json'

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: TypeScript check
        working-directory: apps/frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Test
        working-directory: apps/frontend
        run: npm test -- --run

      - name: Build
        working-directory: apps/frontend
        run: npm run build
