name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/bot/**'
      - 'apps/worker/**'
      - 'packages/shared/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/backend/**'
      - 'apps/bot/**'
      - 'apps/worker/**'
      - 'packages/shared/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/backend/requirements.txt'

      - name: Install dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Ruff
        working-directory: apps/backend
        run: ruff check .

      - name: Mypy
        working-directory: apps/backend
        run: mypy app/

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: habits
          POSTGRES_PASSWORD: test
          POSTGRES_DB: habits_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/backend/requirements.txt'

      - name: Install dependencies
        working-directory: apps/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql+asyncpg://habits:test@localhost:5432/habits_test
        run: alembic upgrade head

      - name: Migration round-trip test
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql+asyncpg://habits:test@localhost:5432/habits_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql+asyncpg://habits:test@localhost:5432/habits_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest -v

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'apps/worker/requirements.txt'

      - name: Install dependencies
        working-directory: apps/worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r ../backend/requirements.txt
          pip install ruff mypy

      - name: Ruff
        working-directory: apps/worker
        run: ruff check .

      - name: Mypy
        working-directory: apps/worker
        run: mypy worker/

      - name: Run worker tests
        working-directory: apps/worker
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          REDIS_URL: redis://localhost:6379/0
          BOT_TOKEN: test-bot-token
          SERVICE_SECRET: test-service-secret
        run: pytest -v tests/
