name: backend-ci

on:
  push:
    paths:
      - "apps/backend/**"
      - "infra/docker/backend.Dockerfile"
  pull_request:
    paths:
      - "apps/backend/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: habits
          POSTGRES_USER: habits
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U habits -d habits"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    defaults:
      run:
        working-directory: apps/backend

    env:
      DATABASE_URL: postgresql+asyncpg://habits:test@localhost:5432/habits
      DATABASE_URL_SYNC: postgresql+psycopg2://habits:test@localhost:5432/habits
      REDIS_URL: redis://localhost:6379/0
      BOT_TOKEN: ci-bot-token
      SERVICE_SECRET: ci-secret
      ENVIRONMENT: test
      CORS_ALLOWED_ORIGINS: https://web.telegram.org

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy app/

      - name: Migrate test (upgrade → downgrade → upgrade)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head

      - name: Tests
        run: pytest -v