# Production nginx config for Habit Club on the host (Ubuntu 24.04, port 80/443).
# Это конфиг **хоста** — в docker-compose у нас отдельный internal nginx-контейнер для SPA,
# либо внешний nginx, как здесь.

# Rate limit zone: 10 req/s на IP для API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=catch_limit:10m rate=20r/s;

# Backend upstream
upstream backend_upstream {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Telegram webhook upstream
upstream bot_upstream {
    server 127.0.0.1:8080;
    keepalive 8;
}

# ACME challenge для Let's Encrypt
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend статика (минифицированный Vite SPA)
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Mini App SPA
    location / {
        root /app/apps/frontend/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Сборка Vite (хэшированные имена → кэшируем на год)
    location /assets/ {
        root /app/apps/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Backend API (Telegram Mini App → /api/v1/*)
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Internal API (bot/worker → /internal/*) — закрыт файрволом снаружи
    location /internal/ {
        allow 127.0.0.1;
        deny all;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Telegram webhook
    location /bot/ {
        proxy_pass http://bot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Health-check endpoint
    location /health {
        proxy_pass http://backend_upstream/health;
        access_log off;
    }

    # Скрыть версию nginx
    server_tokens off;
}