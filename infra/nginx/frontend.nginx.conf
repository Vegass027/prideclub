# Frontend nginx (внутри контейнера habit-frontend).
# Маршрутизирует SPA shell по ПУТИ (после миграции с admin.prideclub.fun):
#   /admin, /admin/* → admin.html   (Admin Mini App)
#   /, *              → index.html  (User Mini App, default)
#
# Pravki-subscribe-and-join §0 (admin-path-based 2026-08-10):
# До этой правки маршрутизация была по ДОМЕНУ (admin.prideclub.fun vs app.prideclub.fun).
# У iOS Telegram WebView есть баг: он кэширует HTML по URL-ключу и игнорирует
# Cache-Control: no-store, плюс под нагрузкой режет/модифицирует Host header.
# Cache collision между user и admin HTML для разных доменов невозможно решить
# серверно без изменения архитектуры.
#
# Решение: один домен (app.prideclub.fun) + admin как ПУТЬ /admin/*. Это даёт:
# - Физически разные cache keys (/admin/* vs /marketplace) — невозможна коллизия
# - iOS WebView создаёт новую запись для /admin URL — никаких workaround'ов
# - React Router admin получает basename="/admin" — без изменений в auth/contract
#
# Серверный redirect admin.prideclub.fun → app.prideclub.fun/admin/ — в host nginx
# (см. infra/nginx/nginx.prod.conf). Здесь только SPA fallback.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # === Admin SPA shell ===
    # Точные совпадения для прямого доступа к HTML
    location = /admin.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }
    location = /admin {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        return 302 /admin/;
    }
    location = /admin/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /admin.html =404;
    }
    # SPA fallback для React Router admin (basename="/admin"):
    # /admin/habits, /admin/habits/new, /admin/habits/:id/edit → admin.html
    location /admin/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /admin.html;
    }

    # === User SPA shell (default) ===
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /index.html =404;
    }
    location / {
        try_files $uri /index.html;
    }

    # === Статика (контент-hashed, immutable) ===
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /static/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location ~ ^/avatars/([0-9]+)\.jpg$ {
        alias /usr/share/nginx/html/static/avatars/$1.jpg;
        add_header Content-Type "image/jpeg";
        add_header Cache-Control "public, max-age=21600";
    }
}
