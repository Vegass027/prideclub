# Frontend nginx (внутри контейнера habit-frontend).
# Маршрутизирует SPA shell по домену:
#   admin.prideclub.fun → admin.html   (Admin Mini App)
#   app.prideclub.fun    → index.html   (User Mini App)
#   остальные             → index.html  (default — user app)
#
# Pravki-subscribe-and-join §0 (admin-mobile fix 2026-08-10):
# предыдущая версия использовала `map $host $spa_fallback` — единый server
# блок с server_name _. Работает только если WebView передаёт Host: admin.prideclub.fun
# в каждом запросе. Telegram mobile WebView иногда передаёт другой Host
# (или режет, или кэширует ответ по другому ключу) — результат: $host не
# матчится → default → index.html → user app → invalid_init_data.
#
# Новая версия: явные server блоки по server_name. nginx сам матчит
# server_name ДО обработки location, поэтому любой $host (или его отсутствие)
# для admin.prideclub.fun попадёт в admin-блок.
#
# Cache-Control: no-store на HTML — чтобы при следующем изменении
# маршрутизации мобильный Telegram не закешировал старый shell навсегда.
# Bundle-файлы (/assets/) оставлены с immutable, max-age=1y — у них
# content-hash в имени, инвалидация через смену имени.

# Admin Mini App
server {
    listen 80;
    server_name admin.prideclub.fun;

    root /usr/share/nginx/html;
    index index.html;

    # HTML shell — никогда не кэшируем, чтобы при смене маршрутизации
    # мобильный Telegram WebView не закешировал admin.html как index.html.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }
    location = /admin.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Корень → admin shell
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /admin.html =404;
    }

    # Статика (фото клубов, аватарки) — кэшируем нормально
    location /static/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location ~ ^/avatars/([0-9]+)\.jpg$ {
        alias /usr/share/nginx/html/static/avatars/$1.jpg;
        add_header Content-Type "image/jpeg";
        add_header Cache-Control "public, max-age=21600";
    }

    # SPA fallback: любой неизвестный путь → admin.html
    # (React Router admin на /habits, /habits/new, /habits/:id/edit)
    location / {
        try_files $uri /admin.html;
    }

    # Vite bundle (content-hashed) — immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# User Mini App + всё остальное (default)
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }
    location = /admin.html {
        # На user-домене admin.html не отдаём — 404.
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files /index.html =404;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location ~ ^/avatars/([0-9]+)\.jpg$ {
        alias /usr/share/nginx/html/static/avatars/$1.jpg;
        add_header Content-Type "image/jpeg";
        add_header Cache-Control "public, max-age=21600";
    }

    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
