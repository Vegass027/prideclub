map $host $spa_fallback {
    default "/index.html";
    "admin.prideclub.fun" "/admin.html";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Явные корни SPA — отдаются как статика.
    location = /index.html {
        try_files $uri =404;
    }
    location = /admin.html {
        try_files $uri =404;
    }

    # Корень домена → SPA-shell этого домена.
    location = / {
        try_files $spa_fallback =404;
    }

    # SPA fallback: не нашли файл — отдаём нужный SPA shell.
    location / {
        try_files $uri $uri/ $spa_fallback;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
