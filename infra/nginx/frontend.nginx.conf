map $host $spa_fallback {
    default "/index.html";
    "admin.prideclub.fun" "/admin.html";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Явные корни SPA — отдаются как статика.
    location = /index.html {
        try_files $uri =404;
    }
    location = /admin.html {
        try_files $uri =404;
    }

    # Корень домена → SPA-shell этого домена.
    location = / {
        try_files $spa_fallback =404;
    }

    # Загруженные медиа (фото клубов) — отдаём напрямую с диска,
    # НЕ через SPA fallback. Volume club_uploads смонтирован сюда.
    location /static/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Pravki.md §7.1 v3 (подход D): внутренний endpoint аватарок
    # для nginx try_files с хостового nginx. Worker пишет JPEG в
    # /app/static/avatars/{user_id}.jpg (volume club_uploads → /usr/share/nginx/html/static/avatars/).
    # Внутренний путь (наружу не торчит) — /avatars/{user_id}.jpg.
    # НЕ expose наружу — NginxHost сначала проверяет файл, и только
    # на miss делает proxy_pass на backend.
    # Без try_files! alias сам резолвит файл и возвращает 404 если нет.
    # Cache-Control: public — кешируется между сессиями в WebView (Pravki §7.1 v3.1).
    # 6ч TTL синхронно с Redis file_id TTL (worker перепишет файл при смене file_id).
    location ~ ^/avatars/([0-9]+)\.jpg$ {
        alias /usr/share/nginx/html/static/avatars/$1.jpg;
        add_header Content-Type "image/jpeg";
        add_header Cache-Control "public, max-age=21600";
    }

    # SPA fallback: не нашли файл — отдаём нужный SPA shell.
    location / {
        try_files $uri $uri/ $spa_fallback;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
