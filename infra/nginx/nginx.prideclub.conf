upstream habit_backend { server 127.0.0.1:8000; }
upstream habit_frontend { server 127.0.0.1:5173; }
upstream habit_pgweb { server 127.0.0.1:8081; }

# === Временный HTTP-only конфиг (до получения TLS через setup_tls_prideclub.sh) ===
server {
    listen 80;
    server_name prideclub.fun api.prideclub.fun db.prideclub.fun;

    # ACME challenge для certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    # Pravki.md §7.1 v3 (подход D): аватарки через nginx try_files.
    # ОБЪЯВЛЕНО ДО общего location /api/* — иначе regex /api/* сработает
    # первым и backend будет получать ВСЕ запросы, а не только miss.
    # Flow:
    # 1. Хост nginx делает internal proxy на habit_frontend /avatars/N.jpg
    #    (внутренний путь — НЕ доступен снаружи).
    # 2. Frontend nginx ищет /usr/share/nginx/html/static/avatars/N.jpg.
    #    Если есть — отдаёт с image/jpeg + Cache-Control.
    #    Если нет — 404.
    # 3. На 404 (error_page) — переходим к @avatar_backend_fallback
    #    (cold cache: backend скачает с Telegram, сохранит на volume, отдаст).
    # 4. Следующие запросы — frontend nginx hit, backend не участвует.
    #
    # Безопасность:
    # - Auth: /api/v1/* уже защищён TelegramUserDep в backend.
    #   Хост nginx не делает auth — это делает backend.
    #   Но в кеш-hit пути backend не вызывается → initData не проверяется.
    #   Это намеренно: photo_file_id хранится в БД, кеш-файл прошёл через
    #   backend при первой загрузке. Аватарки других юзеров доступны
    #   (лидерборд показывает чужие фото).
    # - IDOR: user_id — int из URL, не user input.
    location ~ ^/api/v1/users/([0-9]+)/photo$ {
        # Сохраняем $1 (user_id) в переменную — в @avatar_backend_fallback
        # её уже не будет видно, $1 скоупится к location.
        set $avatar_user_id $1;

        # Сначала пробуем frontend nginx (hit = 0 backend запросов).
        proxy_pass http://habit_frontend/avatars/$avatar_user_id.jpg;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;  # 404 от frontend → наш error_page
        error_page 404 = @avatar_backend_fallback;
    }

    # Fallback на backend: cold cache, backend скачает JPEG с Telegram
    # и сохранит на volume. После этого frontend nginx будет hit.
    location @avatar_backend_fallback {
        proxy_pass http://habit_backend/api/v1/users/$avatar_user_id/photo;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location ~ ^/(api|internal|health|ready|openapi\.json|docs|redoc) {
        proxy_pass http://habit_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
    }

    # pgweb (DB UI) — basic auth + IP allowlist
    location /db/ {
        rewrite ^/db/(.*)$ /$1 break;
        proxy_pass http://habit_pgweb;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        auth_basic "PrideClub DB";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # IP allowlist: сервер + твой комп
        allow 127.0.0.1;
        allow 185.191.118.53;
        deny all;
    }

    # Frontend (default)
    location / {
        proxy_pass http://habit_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        proxy_pass http://habit_frontend;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
}
