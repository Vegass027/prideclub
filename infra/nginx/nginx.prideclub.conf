upstream habit_backend { server 127.0.0.1:8000; }
upstream habit_bot     { server 127.0.0.1:8080; }
upstream habit_frontend{ server 127.0.0.1:5173; }

# Pravki-static-2026-08-13: редирект admin.prideclub.fun → app.prideclub.fun
# с сохранением пути "как есть":
#   /admin/habits/123/edit → /admin/habits/123/edit  (НЕ /admin/admin/...)
#   /habits/123/edit       → /admin/habits/123/edit  (legacy: добавляем /admin)
#   /static/...            → /static/...             (исключение для статики клубов)
map $request_uri $admin_redirect_target {
  ~^/static(/.*)?$       https://app.prideclub.fun$request_uri;
  ~^/admin(/.*)?$        https://app.prideclub.fun$request_uri;
  default                https://app.prideclub.fun/admin$request_uri;
}

# HTTP — ACME challenge + redirect to HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name prideclub.fun www.prideclub.fun api.prideclub.fun app.prideclub.fun admin.prideclub.fun;

  location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type "text/plain"; }
  location / { return 301 https://$host$request_uri; }
}

# pgweb admin — basic auth + IP allowlist
server {
  listen 80;
  server_name db.prideclub.fun;
  location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type "text/plain"; }
  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS — admin.prideclub.fun → 301 redirect на app.prideclub.fun/admin/*
# (legacy: после миграции admin Mini App на path-based routing app.prideclub.fun/admin,
# старый домен оставлен как redirect для обратной совместимости прямых ссылок.
# Pravki-subscribe-and-join §Z-12 admin-path-based 2026-08-10.)
server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name admin.prideclub.fun;

  ssl_certificate     /etc/letsencrypt/live/admin.prideclub.fun/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.prideclub.fun/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  client_max_body_size 25m;

  # Путь сохраняется "как есть" (см. map $admin_redirect_target выше):
  # /admin/habits/... → /admin/habits/...   /habits/... → /admin/habits/...
  # /static/...       → /static/...         (исключение из /admin-префикса)
  location / {
    return 301 $admin_redirect_target;
  }
}

# HTTPS — prideclub.fun / www.prideclub.fun → frontend
server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name prideclub.fun www.prideclub.fun;

  ssl_certificate     /etc/letsencrypt/live/prideclub.fun/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/prideclub.fun/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  client_max_body_size 25m;

  # Pravki-static-2026-08-13: /static/* → backend (см. app.prideclub.fun).
  # Backend через FastAPI StaticFiles отдаёт фото/гифки клубов из volume club_uploads
  # с правильным Content-Type (image/gif, image/jpeg, image/png, image/webp).
  location ^~ /static/ {
    proxy_pass http://habit_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public";
  }

  location / {
    proxy_pass http://habit_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# HTTPS — api.prideclub.fun → backend, кроме /bot/webhook → bot
server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name api.prideclub.fun;

  ssl_certificate     /etc/letsencrypt/live/prideclub.fun/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/prideclub.fun/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  client_max_body_size 25m;

  location = /bot/webhook {
    proxy_pass http://habit_bot;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
  }

  location / {
    proxy_pass http://habit_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# HTTPS — app.prideclub.fun → Mini App (frontend + backend API)
server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name app.prideclub.fun;

  ssl_certificate     /etc/letsencrypt/live/prideclub.fun/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/prideclub.fun/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  client_max_body_size 25m;

  # Pravki-static-2026-08-13: фикс бага "гифка/фото не отображается в форме редактирования клуба".
  # После воркэраунда 4a390e1 (multi-stage build → голый nginx:1.27-alpine, см. AGENT_BOOTSTRAP §9)
  # volume club_uploads перестал быть виден внутри frontend-контейнера, потому что bind-mount
  # /app/apps/frontend/dist → /usr/share/nginx/html перекрывает volume club_uploads →
  # /usr/share/nginx/html/static (папки static физически нет внутри контейнера).
  #
  # Бэкенд через FastAPI StaticFiles (apps/backend/app/main.py:166,
  # app.mount("/static", StaticFiles(directory=STATIC_DIR))) корректно отдаёт файлы из volume
  # habit-club_club_uploads с правильным Content-Type (image/gif, image/jpeg, image/png,
  # image/webp — nginx сам определит через mime.types).
  #
  # Покрывает ОБА контура на app.prideclub.fun:
  #   - admin path: /admin/habits/:id/edit → <img src="/static/uploads/club_photos/.../*.gif">
  #   - user path:  /marketplace, /habits/:id → <img src="/static/uploads/club_photos/.../*.gif">
  #
  # ^~ гарантирует, что любое будущее regex-локации (например, ~ \.(gif|jpg)$) не перебьют.
  location ^~ /static/ {
    proxy_pass http://habit_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public";
  }

  # Pravki.md §7.1 v3 (подход D): аватарки через nginx try_files.
  # 1. Сначала проксируем на habit_frontend /avatars/N.jpg (внутренний путь).
  #    Frontend nginx отдаёт файл из volume club_uploads (/usr/share/nginx/html/static/avatars/).
  # 2. На 404 (frontend вернул error_page) → @avatar_backend_fallback
  #    → habit_backend (cold cache: скачает с TG, сохранит, frontend будет hit).
  # После первого hit — backend не участвует, nginx отдаёт 0-cost.
  # === Pravki-subscribe-and-join §Z-12 admin-path-based 2026-08-10 ===
  # Admin API теперь живёт на app.prideclub.fun (а не на отдельном admin.prideclub.fun).
  location ^~ /admin/v1/ {
    proxy_pass http://habit_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Admin SPA shell (/admin/*) — тот же frontend, что и user (один bundle в dist,
  # nginx маршрутизирует по пути). Backend не трогается.
  location /admin/ {
    proxy_pass http://habit_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location ~ ^/api/v1/users/([0-9]+)/photo$ {
    set $avatar_user_id $1;
    proxy_pass http://habit_frontend/avatars/$avatar_user_id.jpg;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 404 = @avatar_backend_fallback;
  }

  location @avatar_backend_fallback {
    proxy_pass http://habit_backend/api/v1/users/$avatar_user_id/photo;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # /api/v1/* и /internal/* → backend (FastAPI CORSMiddleware обработает OPTIONS)
location = /api/v1/events/stream {
  proxy_pass http://habit_backend;
  proxy_http_version 1.1;
  proxy_buffering off;
  proxy_cache off;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;
  proxy_connect_timeout 60s;
  proxy_set_header Connection '';
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  add_header X-Accel-Buffering no;
  access_log off;
}
  location /api/ {
    proxy_pass http://habit_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /internal/ {
    proxy_pass http://habit_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(health|ready|metrics|docs|openapi.json|redoc)$ {
    proxy_pass http://habit_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /metrics {
    proxy_pass http://habit_backend;
    proxy_set_header Host $host;
  }

  # Всё остальное (HTML/JS/CSS) → Vite frontend
  location / {
    proxy_pass http://habit_frontend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

# HTTPS — db.prideclub.fun → pgweb + basic auth
server {
  listen 443 ssl;
  listen [::]:443 ssl;

  server_name db.prideclub.fun;

  ssl_certificate     /etc/letsencrypt/live/prideclub.fun/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/prideclub.fun/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  auth_basic "pgweb";
  auth_basic_user_file /etc/nginx/.htpasswd;

  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_set_header Host $host;
  }
}
