-- Postgres tuning for 2-core / 4 GB VPS (Ubuntu 24.04)
-- Применяется единожды при инициализации кластера через /docker-entrypoint-initdb.d/

-- 25% RAM под shared_buffers (PostgreSQL rule of thumb)
ALTER SYSTEM SET shared_buffers = '1GB';

-- 70% RAM под эффективный кэш (ядро + FS cache)
ALTER SYSTEM SET effective_cache_size = '3GB';

-- Connection pool: 100 достаточно для ~500-1000 DAU
ALTER SYSTEM SET max_connections = 100;

-- Work_mem для сложных leaderboard-запросов
ALTER SYSTEM SET work_mem = '16MB';
ALTER SYSTEM SET maintenance_work_mem = '256MB';

-- WAL под наш поток чек-инов (16MB × 64 = 1GB max WAL)
ALTER SYSTEM SET wal_buffers = '16MB';
ALTER SYSTEM SET max_wal_size = '4GB';
ALTER SYSTEM SET min_wal_size = '1GB';

-- Autovacuum под высокий write-нагрузку чек-инов
ALTER SYSTEM SET autovacuum_vacuum_scale_factor = 0.05;
ALTER SYSTEM SET autovacuum_analyze_scale_factor = 0.025;
ALTER SYSTEM SET autovacuum_vacuum_cost_limit = 1000;

-- Контроль checkpoint'ов на NVMe
ALTER SYSTEM SET checkpoint_completion_target = 0.9;
ALTER SYSTEM SET random_page_cost = 1.1;  -- NVMe, не HDD

-- Logging для observability
ALTER SYSTEM SET log_min_duration_statement = 500;   -- slow query log >500ms
ALTER SYSTEM SET log_checkpoints = on;
ALTER SYSTEM SET log_connections = on;
ALTER SYSTEM SET log_disconnections = on;
ALTER SYSTEM SET log_temp_files = 10;                  -- логируем temp files >10MB
ALTER SYSTEM SET log_lock_waits = on;
ALTER SYSTEM SET log_autovacuum_min_duration = 0;

-- Timezone UTC для всех timestamp вычислений
ALTER SYSTEM SET timezone = 'UTC';

-- Random cleanup
ALTER SYSTEM SET idle_in_transaction_session_timeout = '60s';
ALTER SYSTEM SET statement_timeout = '30s';            -- kill зависшие запросы
ALTER SYSTEM SET lock_timeout = '10s';