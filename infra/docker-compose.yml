version: "3.9"

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  SERVICE_SECRET: ${SERVICE_SECRET}
  INIT_DATA_MAX_AGE_SECONDS: ${INIT_DATA_MAX_AGE_SECONDS:-86400}
  SERVICE_TOKEN_TTL_SECONDS: ${SERVICE_TOKEN_TTL_SECONDS:-60}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENVIRONMENT: ${ENVIRONMENT:-development}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://web.telegram.org}
  BOT_TOKEN: ${BOT_TOKEN}
  SENTRY_DSN: ${SENTRY_DSN:-}
  ADMIN_TELEGRAM_CHAT_ID: ${ADMIN_TELEGRAM_CHAT_ID:-}
  OWNER_TELEGRAM_ID: ${OWNER_TELEGRAM_ID:-0}
  BOT_TOKEN_ADMIN: ${BOT_TOKEN_ADMIN:-}

x-bot-env: &bot-env
  BOT_TOKEN: ${BOT_TOKEN}
  WEBHOOK_SECRET: ${WEBHOOK_SECRET}
  WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL}
  WEBHOOK_PATH: ${WEBHOOK_PATH:-/bot/webhook}
  WEBAPP_URL: ${WEBAPP_URL}
  BACKEND_URL: http://backend:8000
  SERVICE_SECRET: ${SERVICE_SECRET}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-worker-env: &worker-env
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_URL_SYNC: ${DATABASE_URL_SYNC}
  REDIS_URL: ${REDIS_URL}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND}
  SERVICE_SECRET: ${SERVICE_SECRET}
  BOT_TOKEN: ${BOT_TOKEN}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  postgres:
    image: postgres:16-alpine
    container_name: habit-postgres
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1024m
    cpus: 1.0
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-habits}
      POSTGRES_USER: ${POSTGRES_USER:-habits}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql-tuning.conf:/docker-entrypoint-initdb.d/01-tuning.conf:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-habits} -d ${POSTGRES_DB:-habits}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: habit-redis
    restart: unless-stopped
    mem_limit: 320m
    memswap_limit: 384m
    cpus: 0.5
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    container_name: habit-backend
    restart: unless-stopped
    mem_limit: 1024m
    memswap_limit: 1280m
    cpus: 1.5
    environment:
      <<: *backend-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - club_uploads:/app/static
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  bot:
    build:
      context: ..
      dockerfile: infra/docker/bot.Dockerfile
    container_name: habit-bot
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1024m
    cpus: 1.0
    environment:
      <<: *bot-env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: infra/docker/worker.Dockerfile
    container_name: habit-worker
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1024m
    cpus: 1.0
    environment:
      <<: *worker-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: habit-frontend
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 128m
    cpus: 0.2
    volumes:
      - club_uploads:/usr/share/nginx/html/static
    ports:
      - "127.0.0.1:5173:80"

  pgweb:
    image: sosedoff/pgweb:latest
    container_name: habit-pgweb
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 160m
    cpus: 0.3
    environment:
      PGWEB_DATABASE: ${POSTGRES_DB:-habits}
      PGWEB_HOST: postgres
      PGWEB_PORT: 5432
      PGWEB_USER: ${POSTGRES_USER:-habits}
      PGWEB_PASSWORD: ${POSTGRES_PASSWORD}
      PGWEB_LISTEN_ADDR: 0.0.0.0
      PGWEB_LISTEN_PORT: 8081
      PGWEB_SESSIONS: "true"
      PGWEB_DEFAULT_LIMIT: 50
      PGWEB_READ_ONLY: "false"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  club_uploads:
